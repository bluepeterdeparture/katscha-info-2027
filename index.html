<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katscha Info 2027</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: #222; font-family: Arial, Helvetica, sans-serif; }
body { display: flex; align-items: center; justify-content: center; }
#frame { position: relative; overflow: hidden; }
#board { position: absolute; width: 1080px; height: 1920px; padding: 30px; background: #8FBFC9; color: #263238; transform-origin: top left; display: flex; flex-direction: column; }
header { height: 150px; display: flex; align-items: center; color: #173B49; }
h1 { font-size: 60px; margin: 0; }
h2 { font-size: 36px; margin: 0 0 30px; }
.main { display: flex; height: 1000px; margin-bottom: 16px; }
.residents { width: 44%; padding: 28px; background: #f5f6f7; margin-right: 16px; }
.floor { margin-bottom: 12px; }
.floor strong { display: block; font-size: 27px; margin-bottom: 4px; }
.floor span { display: block; font-size: 29px; line-height: 1.2; }
.right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.contacts { min-height: 490px; flex: 0 0 auto; padding: 28px; background: #f5f6f7; margin-bottom: 16px; }
.contacts h2 { margin-bottom: 24px; }
.contact:last-child { margin-bottom: 0; }
.contact { margin-bottom: 25px; font-size: 25px; line-height: 1.4; }
.contact strong { display: block; font-size: 23px; }
.details { white-space: pre-wrap; overflow-wrap: anywhere; }
.photo { background: #d4dce1; color: #607580; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 30px; position: relative; overflow: hidden; min-height: 0; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
.small-photo { flex: 1; min-height: 0; }
.large-photo { flex: 1; margin-bottom: 16px; }
#notice { position: absolute; inset: 0; background: #f5f6f7; color: #173B49; padding: 32px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
#notice-heading { font-size: 42px; margin: 0 0 20px; overflow-wrap: anywhere; }
#notice-message { font-size: 32px; line-height: 1.3; white-space: pre-wrap; overflow-wrap: anywhere; }
footer { height: 210px; display: flex; align-items: center; justify-content: space-around; color: #173B49; }
.time-area { text-align: center; }
#clock { font-size: 76px; font-weight: bold; }
#date { font-size: 25px; margin-top: 10px; }
.boluna { text-align: center; font-size: 25px; }
.qr-placeholder { background: white; color: #52636e; width: 100px; height: 100px; margin: 10px auto; display: flex; align-items: center; justify-content: center; font-size: 23px; }
.version { font-size: 17px; color: #173B49; text-align: center; }
#login, #setup { width: min(90vw, 420px); color: white; background: #112e40; padding: 24px; border-radius: 12px; }
#login input, #login button, #setup select, #setup button { display: block; width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<form id="login"><h2>Katscha Info 2027</h2><p>v013 – Aktivera visning</p><input id="email" type="email" placeholder="E-postadress" autocomplete="username" required><input id="password" type="password" placeholder="Lösenord" autocomplete="current-password" required><button type="submit">Logga in</button><p id="status" role="status"></p></form>
<form id="setup" hidden><h2>Välj entré</h2><select id="entrance" aria-label="Välj entré"></select><button type="submit">Starta visning</button><p id="setup-status" role="status"></p></form>
<div id="frame" hidden><div id="board"><header><h1 id="address"></h1></header><div class="main"><section class="residents"><h2>Boende</h2><div id="resident-list" role="status"></div></section><div class="right"><section class="contacts"><h2>Felanmälan</h2><div class="contact"><strong>FASTIGHET</strong><div class="details" id="contact-pema">Kontaktuppgifter</div></div><div class="contact"><strong>HISS</strong><div class="details" id="contact-hiss">Kontaktuppgifter</div></div><div class="contact"><strong>STÖRNINGSJOUR</strong><div class="details" id="contact-jour">Kontaktuppgifter</div></div><div class="contact"><strong>BRF KATSCHA STYRELSE</strong><div class="details" id="contact-styrelse">Kontaktuppgifter</div></div></section><div class="photo small-photo"><img src="foto1.jpeg" alt="Arbetets museum och Katscha"></div></div></div><div class="photo large-photo"><img id="lower-photo" src="foto2.jpeg" alt="Katscha vid Strömmen"><div id="notice" hidden><h2 id="notice-heading"></h2><div id="notice-message"></div></div></div><footer><div class="time-area"><div id="clock">00:00</div><div id="date"></div></div><div class="boluna">Föreningsinformation<div class="qr-placeholder">QR</div>Besök Boluna</div></footer><div class="version">Katscha Info 2027 | v013 | TESTVERSION</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const el = id => document.getElementById(id);
function resizeBoard() { var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920); el('frame').style.width = (1080 * scale) + 'px'; el('frame').style.height = (1920 * scale) + 'px'; el('board').style.transform = 'scale(' + scale + ')'; }
function updateClock() { var now = new Date(); el('clock').textContent = now.toLocaleTimeString('sv-SE',{timeZone:'Europe/Stockholm',hour:'2-digit',minute:'2-digit',hour12:false}); el('date').textContent = now.toLocaleDateString('sv-SE',{timeZone:'Europe/Stockholm',weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
window.addEventListener('resize',resizeBoard); resizeBoard(); updateClock(); setInterval(updateClock,1000);
const client = window.supabase.createClient('https://gwfhatjzaeqwsqwpuplg.supabase.co','sb_publishable_FBP7gtSKrb1JBFmJz4rmcg_Oji7AgSV',{auth:{storageKey:'katscha-v09-display-auth'}});
const requested = new URLSearchParams(location.search).get('screen');
const fixed = ['2b','2c','2d'].includes(requested) ? requested : null;
const key = 'katscha-v09-display-entrance';
let screens = [], generation = 0;
let activeEntrance = null, refreshTimer = null, lastList = null;
const REFRESH_MS = 5 * 60 * 1000;
const contactIds=['pema','hiss','jour','styrelse'];
// Keep normal typography whenever possible; compact only if the panel exceeds its available height.
function fitContacts(){
 const panel=document.querySelector('.contacts'), right=document.querySelector('.right');
 if(!right.clientHeight)return;
 panel.style.minHeight='490px';
 const items=panel.querySelectorAll('.contact'), headings=panel.querySelectorAll('.contact strong');
 for(const item of items){item.style.fontSize='';item.style.lineHeight='';item.style.marginBottom='';}
 for(const heading of headings)heading.style.fontSize='';
 const limit=right.clientHeight-16;
 for(let size=25;panel.offsetHeight>limit&&size>=12;size--){
  for(let i=0;i<items.length;i++){items[i].style.fontSize=size+'px';items[i].style.lineHeight='1.2';items[i].style.marginBottom=i===items.length-1?'0':'12px';}
  for(const heading of headings)heading.style.fontSize=Math.min(23,size)+'px';
 }
}
function current(id,request){return request===generation&&activeEntrance===id;}
function clearExtras(){for(const id of contactIds)el('contact-'+id).textContent='Kontaktuppgifter';el('notice').hidden=true;el('lower-photo').hidden=false;el('notice-heading').textContent='';el('notice-message').textContent='';}
function stopRefresh(){ clearTimeout(refreshTimer); refreshTimer=null; activeEntrance=null; lastList=null; }
function hideBoard(message) { stopRefresh(); generation++; screens=[]; el('frame').hidden=true; el('setup').hidden=true; el('login').hidden=false; el('status').textContent=message||''; el('resident-list').replaceChildren(); clearExtras(); }
async function refreshResidents(id, request) {
 const list=el('resident-list');
 try {
  const {data,error}=await client.from('residents').select('floor,name,sort_order').eq('screen_id',id).order('sort_order').order('id');
  if(!current(id,request))return;
  if(error)throw error;
  const rows=data||[], signature=JSON.stringify(rows);
  if(signature!==lastList){
   const fragment=document.createDocumentFragment(), floors=new Map();
   if(!rows.length)fragment.appendChild(document.createTextNode('Ingen boendelista tillgänglig.'));
   for(const resident of rows){
    if(!floors.has(resident.floor)){const group=document.createElement('div');group.className='floor';const heading=document.createElement('strong');heading.textContent=resident.floor;group.appendChild(heading);fragment.appendChild(group);floors.set(resident.floor,group);}
    const name=document.createElement('span');name.textContent=resident.name;floors.get(resident.floor).appendChild(name);
   }
   list.replaceChildren(fragment);lastList=signature;
  }
 } catch(_) {if(current(id,request)&&lastList===null)list.textContent='Boendelistan kunde inte hämtas.';}
}
async function refreshContacts(id,request){
 try{const {data,error}=await client.from('katscha_contacts').select('id,details');if(!current(id,request))return;if(error||!data||contactIds.some(k=>!data.some(r=>r.id===k)))return;
 for(const k of contactIds)el('contact-'+k).textContent=data.find(r=>r.id===k).details||'';
 fitContacts();
 }catch(_){}
}
async function refreshNotice(id,request){
 try{const {data,error}=await client.from('katscha_notices').select('screen_id,enabled,heading,message').eq('screen_id',id).single();if(!current(id,request)||error||!data)return;
 el('notice-heading').textContent=data.heading||'';el('notice-heading').hidden=!data.heading;el('notice-message').textContent=data.message||'';el('notice').hidden=!data.enabled;el('lower-photo').hidden=!!data.enabled;
 }catch(_){}
}
async function refreshBoard(id,request){
 try{await Promise.all([refreshResidents(id,request),refreshContacts(id,request),refreshNotice(id,request)]);}finally{if(current(id,request))refreshTimer=setTimeout(()=>refreshBoard(id,request),REFRESH_MS);}
}
async function showEntrance(id) {
 const screen=screens.find(s=>s.id===id); if(!screen) return hideBoard('Ingen aktiv entré.');
 stopRefresh(); clearExtras(); activeEntrance=id;
 try {if(!fixed)localStorage.setItem(key,id);}catch(_){}
 el('address').textContent=screen.address;el('login').hidden=true;el('setup').hidden=true;el('frame').hidden=false;resizeBoard();fitContacts();
 const request=++generation;el('resident-list').textContent='Hämtar boendelista…';
 await refreshBoard(id,request);
}
async function loadScreens(){ stopRefresh(); const request=++generation; const {data:sessionData,error:sessionError}=await client.auth.getSession(); if(request!==generation)return; if(sessionError||!sessionData.session)return hideBoard('Logga in en gång för att aktivera skärmen.'); const {data,error}=await client.from('screens').select('id,address,active').eq('active',true).order('id'); if(request!==generation)return; if(error||!data||!data.length)return hideBoard('Ingen information tillgänglig.'); screens=data; if(fixed)return showEntrance(fixed); let saved;try{saved=localStorage.getItem(key);}catch(_){} if(screens.some(s=>s.id===saved)&&new URLSearchParams(location.search).get('setup')!=='1')return showEntrance(saved); const select=el('entrance');select.replaceChildren();screens.forEach(s=>{const option=document.createElement('option');option.value=s.id;option.textContent=s.address;select.appendChild(option);});if(screens.some(s=>s.id===saved))select.value=saved;el('login').hidden=true;el('frame').hidden=true;el('setup').hidden=false; }
el('setup').addEventListener('submit',e=>{e.preventDefault();showEntrance(el('entrance').value);});
el('login').addEventListener('submit',async e=>{e.preventDefault();el('status').textContent='Ansluter…';try{const {error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)return hideBoard('Inloggningen misslyckades: '+error.message);await loadScreens();}catch(_){hideBoard('Anslutningen misslyckades.');}finally{el('password').value='';}});
client.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')hideBoard('Utloggad.');});
loadScreens().catch(()=>hideBoard('Anslutningen misslyckades.'));
</script></body></html>
