<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Katscha Administration</title><link rel="apple-touch-icon" href="icon.png"><style>
*{box-sizing:border-box}body{margin:0;background:#8FBFC9;color:#173B49;font:16px Arial,sans-serif}main{max-width:680px;margin:auto;padding:20px}section,form#login{background:#f5f6f7;padding:18px;border-radius:10px;margin-bottom:12px}h1{font-size:28px}h2{font-size:20px}h3{font-size:15px;margin:0 0 12px}input,select,button,textarea{font:inherit;padding:12px;border:1px solid #879da5;border-radius:7px;min-width:0}input,select,textarea{width:100%;background:white;color:#173B49}button{background:#173B49;color:white;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:white;color:#173B49}button.remove{background:white;color:#923333}label{display:block;margin:10px 0 5px}.line{display:flex;gap:8px;margin:8px 0;align-items:center}.line input{flex:1}.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.tabs button{flex:1}.tabs button[aria-pressed=false]{background:white;color:#173B49}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.status{white-space:pre-wrap;overflow-wrap:anywhere}footer{font-size:13px;text-align:center;margin:20px 0}[hidden]{display:none!important}@media(max-width:420px){main{padding:12px}.line button{padding:10px 6px}}

#nav button{min-width:0;white-space:normal;overflow-wrap:normal}
#nav .mobile-label{display:none}
#contacts textarea{display:block;line-height:1.4;min-height:calc(7em + 26px);resize:none;overflow-y:hidden;overflow-wrap:anywhere}
@media(max-width:600px){main{padding:12px}h1{font-size:23px}#nav{gap:6px;flex-wrap:nowrap}#nav button{font-size:14px;padding:12px 4px}#nav .desktop-label{display:none}#nav .mobile-label{display:inline}section,form#login{padding:14px}h2{font-size:18px}}
@media(max-width:340px){#nav{flex-wrap:wrap}#nav button{flex:1 1 100%}}
</style></head><body><main><h1>Katscha Administration</h1><p>v013</p><form id="login"><label for="email">E-postadress</label><input id="email" type="email" autocomplete="username" required><label for="password">Lösenord</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button>Logga in</button></div></form><div id="admin" hidden><div class="tabs" id="nav"></div><div id="residentPanel"><h2>Redigera boendelista</h2><div class="tabs" id="tabs"></div><div id="floors"></div><div class="actions"><button id="save">Spara ändringar</button><button id="reload" class="secondary">Ångra osparade ändringar</button></div></div><section id="contactPanel" hidden><h2>Kontaktuppgifter – alla entréer</h2><div id="contacts"></div><button id="saveContacts">Spara kontaktuppgifter</button></section><section id="noticePanel" hidden><h2>Tillfälligt meddelande</h2><label for="target">Visa på</label><select id="target"><option value="2b">2B</option><option value="2c">2C</option><option value="2d">2D</option><option value="all">Samtliga entréer</option></select><p id="noticeHint"></p><label for="mode">Nedre bildyta</label><select id="mode"><option value="photo">Visa bild</option><option value="message">Visa meddelande</option></select><div id="noticeFields"><label for="heading">Rubrik (max 60 tecken)</label><input id="heading" maxlength="60"><label for="message">Meddelande (max 350 tecken)</label><textarea id="message" rows="5" maxlength="350"></textarea></div><div class="actions"><button id="saveNotice">Spara ändringar</button></div></section><button id="logout" class="secondary">Logga ut</button></div><p id="status" class="status" role="status" aria-live="polite"></p><footer>Katscha Info 2027 | v013 | TESTVERSION</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const el=id=>document.getElementById(id),status=t=>el('status').textContent=t;
const base=['VÅNING 5','VÅNING 4','VÅNING 3','VÅNING 2 B','VÅNING 2','ENTRÉPLAN'];
const floors={'2b':base,'2c':base,'2d':['VÅNING 7','VÅNING 6',...base]};
const labels={pema:'FASTIGHET',hiss:'HISS',jour:'STÖRNINGSJOUR',styrelse:'BRF KATSCHA STYRELSE'};
let client,entrance='2b',original=[],draft=[],busy=false,ready=false,panel='resident',extraReady=false,contactRows=[],noticeRows=[],target='2b',noticeOriginal='';
const dirty=()=>JSON.stringify(original)!==JSON.stringify(draft);
const noticeValue=()=>({enabled:el('mode').value==='message',heading:el('heading').value,message:el('message').value});
function changed(){if(panel==='resident')return ready&&dirty();if(!extraReady)return false;if(panel==='contact')return contactRows.some(r=>el('contact-'+r.id).value!==r.details);return JSON.stringify(noticeValue())!==noticeOriginal;}
function button(text,fn,cls=''){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.onclick=fn;return b;}
function lock(value){busy=value;document.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=value);el('save').disabled=value||!ready||!dirty();el('saveContacts').disabled=value||!extraReady||panel!=='contact';el('saveNotice').disabled=value||!extraReady||panel!=='notice';}
function render(){el('tabs').replaceChildren();for(const id of Object.keys(floors)){const b=button(id.toUpperCase(),async()=>{if(busy||id===entrance)return;if(dirty()&&!confirm('Byta entré utan att spara?'))return;entrance=id;await load();});b.setAttribute('aria-pressed',String(id===entrance));el('tabs').append(b);}el('floors').replaceChildren();if(!ready){el('save').disabled=true;return;}for(const floor of floors[entrance]){const section=document.createElement('section'),h=document.createElement('h3');h.textContent=floor;section.append(h);for(const r of draft.filter(x=>x.floor===floor)){const line=document.createElement('div');line.className='line';const input=document.createElement('input');input.value=r.name;input.maxLength=120;input.setAttribute('aria-label','Namn på '+floor);input.oninput=()=>{r.name=input.value;el('save').disabled=!dirty()||busy;};line.append(input,button('Ta bort',()=>{if(confirm('Ta bort '+(r.name||'det nya namnet')+'?')){draft=draft.filter(x=>x!==r);render();}},'remove'));section.append(line);}section.append(button('+ Lägg till namn',()=>{draft.push({id:null,floor,name:'',sort_order:0});render();},'secondary'));el('floors').append(section);}lock(busy);}
async function load(message=''){ready=false;lock(true);render();status('Hämtar boendelista…');try{const {data,error}=await client.from('residents').select('id,floor,name,sort_order').eq('screen_id',entrance).order('sort_order').order('id');if(error)throw error;if(data.some(r=>!floors[entrance].includes(r.floor)))throw new Error('Okänt våningsplan. Kontakta administratören.');original=data;draft=data.map(r=>({...r}));ready=true;status(message);}catch(e){status('Kunde inte läsa: '+e.message);}finally{lock(false);render();}}
function nav(){el('nav').replaceChildren();for(const [id,title] of [['resident','Boendelista'],['contact','Kontaktuppgifter'],['notice','Meddelanden']]){const b=button('',()=>switchPanel(id));const full=document.createElement('span'),short=document.createElement('span');full.className='desktop-label';full.textContent=title;short.className='mobile-label';short.textContent=({resident:'Boende',contact:'Kontakter',notice:'Meddelanden'})[id];b.append(full,short);b.setAttribute('aria-pressed',String(panel===id));el('nav').append(b);}}
async function switchPanel(id,force=false){if(!force&&(busy||id===panel))return;if(!force&&changed()&&!confirm('Lämna utan att spara?'))return;panel=id;extraReady=false;for(const p of ['resident','contact','notice'])el(p+'Panel').hidden=p!==id;nav();if(id==='resident')await load();else await loadExtra();}
function fillNotice(){const rows=target==='all'?noticeRows:noticeRows.filter(r=>r.screen_id===target);const same=rows.every(r=>r.enabled===rows[0].enabled&&r.heading===rows[0].heading&&r.message===rows[0].message);const r=same?rows[0]:{enabled:false,heading:'',message:''};el('noticeHint').textContent=target==='all'?(same?'Ändringar gäller alla tre entréer.':'Entréerna har olika innehåll. Sparande ersätter innehållet på alla tre.') : '';el('mode').value=r.enabled?'message':'photo';el('heading').value=r.heading;el('message').value=r.message;el('noticeFields').hidden=!r.enabled;noticeOriginal=JSON.stringify(noticeValue());}
function fitContact(input){if(!input.getClientRects().length)return;input.style.height='auto';input.style.height=(input.scrollHeight+input.offsetHeight-input.clientHeight)+'px';}
window.addEventListener('resize',()=>document.querySelectorAll('#contacts textarea').forEach(fitContact));
async function loadExtra(message=''){extraReady=false;lock(true);status('Hämtar information…');try{if(panel==='contact'){const {data,error}=await client.from('katscha_contacts').select('id,details');if(error)throw error;if(!data||Object.keys(labels).some(id=>!data.some(r=>r.id===id)))throw new Error('Kontaktuppgifter saknas.');contactRows=data;el('contacts').replaceChildren();for(const id of Object.keys(labels)){const label=document.createElement('label');label.htmlFor='contact-'+id;label.textContent=labels[id];const input=document.createElement('textarea');input.id=label.htmlFor;input.maxLength=180;input.rows=5;input.value=data.find(r=>r.id===id).details;el('contacts').append(label,input);input.addEventListener('input',()=>fitContact(input));fitContact(input);}}else{const {data,error}=await client.from('katscha_notices').select('screen_id,enabled,heading,message');if(error)throw error;if(!data||Object.keys(floors).some(id=>!data.some(r=>r.screen_id===id)))throw new Error('Meddelandeinställningar saknas.');noticeRows=data;el('target').value=target;fillNotice();}extraReady=true;status(message);}catch(e){status('Kunde inte läsa: '+e.message);}finally{lock(false);}}
el('target').onchange=()=>{if(changed()&&!confirm('Byta entré utan att spara?')){el('target').value=target;return;}target=el('target').value;fillNotice();};el('mode').onchange=()=>el('noticeFields').hidden=el('mode').value!=='message';
el('saveContacts').onclick=async()=>{if(busy||!extraReady)return;lock(true);try{for(const r of contactRows){const details=el('contact-'+r.id).value.trim();if(details===r.details)continue;const {data,error}=await client.from('katscha_contacts').update({details}).eq('id',r.id).select('id');if(error)throw error;if(data.length!==1)throw new Error('Ändringen nekades.');}await loadExtra('Kontaktuppgifterna är sparade.');}catch(e){await loadExtra('Sparandet avbröts: '+e.message+' Kontrollera uppgifterna; vissa ändringar kan ha sparats.');}};
el('saveNotice').onclick=async()=>{if(busy||!extraReady)return;const value=noticeValue();if(value.enabled&&!value.heading.trim()&&!value.message.trim()){status('Skriv en rubrik eller ett meddelande.');return;}if(target==='all'&&!confirm('Spara för samtliga tre entréer?'))return;lock(true);try{const ids=target==='all'?Object.keys(floors):[target];const payload=value.enabled?value:{enabled:false};const {data,error}=await client.from('katscha_notices').update(payload).in('screen_id',ids).select('screen_id');if(error)throw error;if(data.length!==ids.length)throw new Error('Alla ändringar kunde inte bekräftas.');await loadExtra(value.enabled?'Meddelandet är sparat.':'Bilden återställs.');}catch(e){await loadExtra('Sparandet kunde inte bekräftas: '+e.message);}};
async function activate(session){if(!session||session.user.app_metadata.katscha_admin!==true||session.user.app_metadata.katscha_access!==true){if(session)await client.auth.signOut({scope:'local'});reset();status(session?'Kontot saknar administratörsbehörighet.':'Logga in som administratör.');return;}el('login').hidden=true;el('admin').hidden=false;await switchPanel('resident',true);}
el('save').onclick=async()=>{if(busy||!ready||!dirty())return;if(draft.some(r=>!r.name.trim())){status('Fyll i alla namn eller ta bort tomma rader.');return;}lock(true);status('Sparar…');try{for(const r of draft){const old=original.find(x=>x.id===r.id);if(old&&old.name!==r.name.trim()){const {data,error}=await client.from('residents').update({name:r.name.trim()}).eq('id',r.id).eq('screen_id',entrance).select('id');if(error)throw error;if(data.length!==1)throw new Error('Ändringen nekades eller posten saknas.');}}for(const r of draft.filter(x=>x.id===null)){const order=({'2b':[1,3,5,7,8,10],'2c':[1,3,5,7,8,10],'2d':[1,2,3,5,7,9,10,12]})[entrance][floors[entrance].indexOf(r.floor)];const {data,error}=await client.from('residents').insert({screen_id:entrance,floor:r.floor,name:r.name.trim(),sort_order:order}).select('id');if(error)throw error;if(data.length!==1)throw new Error('Tillägget kunde inte bekräftas.');}for(const r of original.filter(x=>!draft.some(y=>y.id===x.id))){const {data,error}=await client.from('residents').delete().eq('id',r.id).eq('screen_id',entrance).select('id');if(error)throw error;if(data.length!==1)throw new Error('Borttagningen nekades eller posten saknas.');}await load('Ändringarna är sparade.');}catch(e){await load('Sparandet avbröts: '+e.message+'\nVissa ändringar kan redan ha sparats. Listan har hämtats på nytt. Kontrollera innan du försöker igen.');}};
el('reload').onclick=()=>{if(!busy&&(!dirty()||confirm('Ångra osparade ändringar?')))load();};
el('logout').onclick=async()=>{if(busy||(changed()&&!confirm('Logga ut utan att spara?')))return;lock(true);try{const {error}=await client.auth.signOut({scope:'local'});if(error)throw error;reset();status('Utloggad.');}catch(e){status(e.message);}finally{lock(false);}};
function reset(){ready=false;extraReady=false;original=[];draft=[];contactRows=[];noticeRows=[];el('floors').replaceChildren();el('contacts').replaceChildren();el('heading').value='';el('message').value='';el('admin').hidden=true;el('login').hidden=false;}
el('login').onsubmit=async e=>{e.preventDefault();if(busy)return;lock(true);status('Ansluter…');try{const {data,error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)throw error;await activate(data.session);}catch(e){status('Inloggningen misslyckades: '+e.message);}finally{el('password').value='';lock(false);}};
async function init(){try{client=window.supabase.createClient('https://gwfhatjzaeqwsqwpuplg.supabase.co','sb_publishable_FBP7gtSKrb1JBFmJz4rmcg_Oji7AgSV',{auth:{storageKey:'katscha-v010-admin-auth'}});client.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){reset();status('Utloggad.');}});const {data,error}=await client.auth.getSession();if(error)throw error;await activate(data.session);}catch(e){status('Anslutningen misslyckades: '+e.message);}}init();
</script></body></html>
