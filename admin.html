<!DOCTYPE html>
<html lang="sv">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Katscha Administration</title><link rel="apple-touch-icon" href="icon.png"><style>
*{box-sizing:border-box}body{margin:0;background:#8FBFC9;color:#173B49;font:16px Arial,sans-serif}main{max-width:680px;margin:auto;padding:20px}section,form#login{background:#f5f6f7;padding:18px;border-radius:10px;margin-bottom:12px}h1{font-size:28px}h2{font-size:20px}h3{font-size:15px;margin:0 0 12px}input,select,button{font:inherit;padding:12px;border:1px solid #879da5;border-radius:7px;min-width:0}input,select{width:100%;background:white;color:#173B49}button{background:#173B49;color:white;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:white;color:#173B49}button.remove{background:white;color:#923333}label{display:block;margin:10px 0 5px}.line{display:flex;gap:8px;margin:8px 0;align-items:center}.line input{flex:1}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.tabs button[aria-pressed=false]{background:white;color:#173B49}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.status{white-space:pre-wrap;overflow-wrap:anywhere}footer{font-size:13px;text-align:center;margin:20px 0}[hidden]{display:none!important}@media(max-width:420px){main{padding:12px}.line button{padding:10px 6px}}
</style></head><body><main><h1>Katscha Administration</h1><p>v0.10 – Boendelista</p><form id="login"><label for="email">E-postadress</label><input id="email" type="email" autocomplete="username" required><label for="password">Lösenord</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button>Logga in</button></div></form><div id="admin" hidden><h2>Redigera boendelista</h2><div class="tabs" id="tabs"></div><div id="floors"></div><div class="actions"><button id="save">Spara ändringar</button><button id="reload" class="secondary">Ångra osparade ändringar</button></div><button id="logout" class="secondary">Logga ut</button></div><p id="status" class="status" role="status" aria-live="polite"></p><footer>Katscha Info 2027 | v0.10 | TESTVERSION</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const el=id=>document.getElementById(id);
const status=t=>el('status').textContent=t;
const base=['VÅNING 5','VÅNING 4','VÅNING 3','VÅNING 2 B','VÅNING 2','ENTRÉPLAN'];
const floors={'2b':base,'2c':base,'2d':['VÅNING 7','VÅNING 6',...base]};
let client, entrance='2b', original=[], draft=[], busy=false, ready=false;
const dirty=()=>JSON.stringify(original)!==JSON.stringify(draft);
function button(text,fn,cls=''){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.onclick=fn;return b;}
function lock(value){busy=value;document.querySelectorAll('button,input').forEach(x=>x.disabled=value);el('save').disabled=value||!ready||!dirty();}
function render(){el('tabs').replaceChildren();for(const id of Object.keys(floors)){const b=button(id.toUpperCase(),async()=>{if(busy||id===entrance)return;if(dirty()&&!confirm('Byta entré utan att spara?'))return;entrance=id;await load();});b.setAttribute('aria-pressed',String(id===entrance));el('tabs').append(b);}el('floors').replaceChildren();if(!ready){el('save').disabled=true;return;}for(const floor of floors[entrance]){const section=document.createElement('section'),h=document.createElement('h3');h.textContent=floor;section.append(h);for(const r of draft.filter(x=>x.floor===floor)){const line=document.createElement('div');line.className='line';const input=document.createElement('input');input.value=r.name;input.maxLength=120;input.setAttribute('aria-label','Namn på '+floor);input.oninput=()=>{r.name=input.value;el('save').disabled=!dirty()||busy;};line.append(input,button('Ta bort',()=>{if(confirm('Ta bort '+(r.name||'det nya namnet')+'?')){draft=draft.filter(x=>x!==r);render();}},'remove'));section.append(line);}section.append(button('+ Lägg till namn',()=>{draft.push({id:null,floor,name:'',sort_order:0});render();},'secondary'));el('floors').append(section);}lock(busy);}
async function load(message=''){ready=false;lock(true);render();status('Hämtar boendelista…');try{const {data,error}=await client.from('residents').select('id,floor,name,sort_order').eq('screen_id',entrance).order('sort_order').order('id');if(error)throw error;if(data.some(r=>!floors[entrance].includes(r.floor)))throw new Error('Okänt våningsplan. Kontakta administratören.');original=data;draft=data.map(r=>({...r}));ready=true;status(message);}catch(e){status('Kunde inte läsa: '+e.message);}finally{lock(false);render();}}
async function activate(session){if(!session||session.user.app_metadata.katscha_admin!==true||session.user.app_metadata.katscha_access!==true){if(session)await client.auth.signOut({scope:'local'});el('admin').hidden=true;el('login').hidden=false;status(session?'Kontot saknar administratörsbehörighet.':'Logga in som administratör.');return;}el('login').hidden=true;el('admin').hidden=false;await load();}
el('save').onclick=async()=>{if(busy||!ready||!dirty())return;if(draft.some(r=>!r.name.trim())){status('Fyll i alla namn eller ta bort tomma rader.');return;}lock(true);status('Sparar…');try{for(const r of draft){const old=original.find(x=>x.id===r.id);if(old&&old.name!==r.name.trim()){const {data,error}=await client.from('residents').update({name:r.name.trim()}).eq('id',r.id).eq('screen_id',entrance).select('id');if(error)throw error;if(data.length!==1)throw new Error('Ändringen nekades eller posten saknas.');}}for(const r of draft.filter(x=>x.id===null)){const order=({ '2b':[1,3,5,7,8,10], '2c':[1,3,5,7,8,10], '2d':[1,2,3,5,7,9,10,12] })[entrance][floors[entrance].indexOf(r.floor)];const {data,error}=await client.from('residents').insert({screen_id:entrance,floor:r.floor,name:r.name.trim(),sort_order:order}).select('id');if(error)throw error;if(data.length!==1)throw new Error('Tillägget kunde inte bekräftas.');}for(const r of original.filter(x=>!draft.some(y=>y.id===x.id))){const {data,error}=await client.from('residents').delete().eq('id',r.id).eq('screen_id',entrance).select('id');if(error)throw error;if(data.length!==1)throw new Error('Borttagningen nekades eller posten saknas.');}await load('Ändringarna är sparade.');}catch(e){await load('Sparandet avbröts: '+e.message+'\nVissa ändringar kan redan ha sparats. Listan har hämtats på nytt. Kontrollera innan du försöker igen.');}};
el('reload').onclick=()=>{if(!busy&&(!dirty()||confirm('Ångra osparade ändringar?')))load();};
el('logout').onclick=async()=>{if(busy||(dirty()&&!confirm('Logga ut utan att spara?')))return;lock(true);try{const {error}=await client.auth.signOut({scope:'local'});if(error)throw error;reset();status('Utloggad.');}catch(e){status(e.message);}finally{lock(false);}};
function reset(){ready=false;original=[];draft=[];el('floors').replaceChildren();el('admin').hidden=true;el('login').hidden=false;}
el('login').onsubmit=async e=>{e.preventDefault();if(busy)return;lock(true);status('Ansluter…');try{const {data,error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)throw error;await activate(data.session);}catch(e){status('Inloggningen misslyckades: '+e.message);}finally{el('password').value='';lock(false);}};
async function init(){try{client=window.supabase.createClient('https://gwfhatjzaeqwsqwpuplg.supabase.co','sb_publishable_FBP7gtSKrb1JBFmJz4rmcg_Oji7AgSV',{auth:{storageKey:'katscha-v010-admin-auth'}});client.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){reset();status('Utloggad.');}});const {data,error}=await client.auth.getSession();if(error)throw error;await activate(data.session);}catch(e){status('Anslutningen misslyckades: '+e.message);}}init();
</script></body></html>
